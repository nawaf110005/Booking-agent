[project]
name = "booking-agent"
version = "0.1.0"
description = "AI Event Ticket Booking Agent — chat-first booking with member discounts, atomic seat holds, HITL confirmation, and signed QR tickets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Nawaf Almufarej" },
    { name = "Dana" },
    { name = "Hessa" },
    { name = "Refal" },
]

dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dateutil>=2.9.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pillow>=10.3.0",      # seat-map + ticket image rendering
    "qrcode>=7.4.0",       # HMAC-signed QR payload (F003)
]

[project.optional-dependencies]
# Lightweight LLM path used by agent/llm.py (direct SDKs; covers nanogpt via openai).
llm = [
    "openai>=1.40.0",
    "anthropic>=0.39.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",       # Moyasar sandbox calls + test client
]
fulfilment = [
    "reportlab>=4.2.0",    # PDF ticket
]
rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "freezegun>=1.5.0",    # seat-hold TTL / expiry tests
]

[project.scripts]
booking-agent = "booking_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booking_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    # Keep the suite quiet across Python/SQLite/Pydantic minor versions.
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src/booking_agent"]
omit = [
    "src/booking_agent/cli.py",
    "src/booking_agent/db/seed.py",
    "src/booking_agent/api/app.py",       # thin FastAPI factory
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "E501",   # long lines (docstrings, tables)
    "UP042",  # str+Enum mixin is intentional
    "B008",   # FastAPI Depends/Query defaults are idiomatic
    "RUF001", # ambiguous unicode (×, —) used deliberately in display strings
    "RUF002", # ditto, in docstrings
    "RUF003", # ditto, in comments
    "N812",   # `agent.state as S` — intentional module alias for step constants
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
